# Publica a pasta site/ no GitHub Pages a cada envio para a branch main.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Abre todas as abas em cada tipo de acesso, com dados simulados. Se alguma tela der erro, não publica.
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o navegador de teste
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir as telas
        run: node testes/conferir-telas.mjs

  publicar:
    needs: conferir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # O GitHub Pages manda o navegador guardar cada arquivo por 10 min. Para cada publicação valer na hora
      # (e o navegador não misturar arquivos novos e antigos), todo .js e .css ganha "?v=<versão>" no endereço.
      - name: Marcar a versão nos arquivos
        run: |
          v="${GITHUB_SHA::7}"
          mapa=""
          for f in site/js/*.js; do
            n="$(basename "$f")"
            mapa="${mapa}\"./js/${n}\":\"./js/${n}?v=${v}\","
          done
          mapa="{\"imports\":{${mapa%,}}}"
          sed -i "s#href=\"css/estilo.css\"#href=\"css/estilo.css?v=${v}\"#; s#src=\"js/app.js\"#src=\"js/app.js?v=${v}\"#" site/index.html site/privacidade.html
          sed -i "s#<!--VERSAO-->#<script type=\"importmap\">${mapa}</script>#" site/index.html
          grep -q 'type="importmap"' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
